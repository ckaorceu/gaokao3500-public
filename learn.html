    <label class="tf"><span>词根词缀</span><input id="trickRoot" placeholder="un- 否定；-able 能…的；bio- 生命"></label>
    <label class="tf"><span>谐音记忆</span><input id="trickHomo" placeholder="ambulance 谐音「俺不能死」→ 救护车"></label>
    <label class="tf"><span>例句</span><input id="trickEx" placeholder="He abandoned his car in the snow. 他把车丢在雪里。"></label>
    <div class="dlg-actions">
      <button type="button" class="ghost" onclick="closeTrick()">取消</button>
      <button type="button" class="primary" onclick="saveTrick()">保存</button>
    </div>
  </form>
</dialog>
