<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>找回密码 · 高考英语3500词巧记</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="common.js?v=1" charset="utf-8"></script>

<style>
  body { font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fb; margin: 0; }
  .wrap { max-width: 420px; margin: 12vh auto; padding: 0 16px; }

</style>

<body>
<div class="wrap">
  <div class="auth-box">
    <h3>设置新密码</h3>

    <input id="newPw" type="password" placeholder="新密码（至少 6 位）" autocomplete="new-password" style="display:none">
    <button id="setPw" class="auth-btn primary" style="display:none">更新密码</button>
    <div class="row"><a href="index.html" id="backHome">返回首页</a></div>
  </div>
</div>
